[project]
name = "math_problems"
version = "0.1.0"
description = "math_problems using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]",
    "litellm>=1.83.0",
    "splunk-opentelemetry",
    "splunk-otel-instrumentation-crewai",
    "splunk-otel-instrumentation-openai",
    "splunk-otel-genai-emitters-splunk",
    "splunk-otel-util-genai",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[project.scripts]
math_problems = "math_problems.main:run"
run_crew = "math_problems.main:run"
train = "math_problems.main:train"
replay = "math_problems.main:replay"
test = "math_problems.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
constraint-dependencies = [
    "urllib3>=2.8.0",
    "pyjwt>=2.15.1",
]
