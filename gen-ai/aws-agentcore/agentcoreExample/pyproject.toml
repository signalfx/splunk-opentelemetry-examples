
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcoreExample"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "bedrock-agentcore>=1.18.1",
    "langchain >= 1.0.3",
    "langchain-mcp-adapters >= 0.1.11",
    "langchain-openai >= 1.0.3",
    "langgraph>=1.2.14",
    "langchain-core >= 1.2.28",
    "mcp >= 1.30.0",
    "opentelemetry-instrumentation-boto>=0.59b0",
    "opentelemetry-instrumentation-urllib3>=0.59b0",
    "python-dotenv >= 1.2.1",
    "splunk-opentelemetry==2.8.0",
    "splunk-otel-genai-emitters-splunk>=0.1.6",
    "splunk-otel-genai-evals-deepeval>=0.1.12",
    "splunk-otel-instrumentation-langchain>=0.1.7",
    "splunk-otel-util-genai>=0.1.9",
    "tiktoken==0.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
pythonpath = ["src"]

[tool.uv]
constraint-dependencies = [
    "urllib3>=2.8.0",
    "pyjwt>=2.15.1",
    "langgraph-sdk>=0.4.6",
    "multidict>=6.9.1",
    "certifi>=2026.10.19",
    "aiohttp>=3.14.4",
    "setuptools>=84.1.0",
    "mcp>=1.30.0,<2",
    # splunk-otel-util-genai imports opentelemetry._events, removed in API 1.45.
    # Stay on the 1.38 distro until that package supports 1.45.1.
    "splunk-opentelemetry==2.8.0",
]
