[project]
name = "math_problems"
version = "0.1.0"
description = "Solving math problems using OpenAI Agents SDK"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "openai-agents>=0.2.6",
    "openlit>=1.35.0",
    "splunk-opentelemetry>=2.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
constraint-dependencies = [
    "urllib3>=2.8.0",
    "pyjwt>=2.15.1",
]
