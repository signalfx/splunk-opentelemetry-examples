[project]
name = "startup_ideas"
version = "0.1.0"
description = "Startup Ideas using AutoGen"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "autogen-agentchat>=0.7.4",
    "autogen-core>=0.7.4",
    "autogen-ext>=0.7.4",
    "tiktoken",
    "openlit>=1.45.0",
    "mcp>=1.30.0,<2",
    "splunk-opentelemetry",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
# autogen-core 0.7.x caps protobuf at 5.29.x, which cannot carry the
# patched OpenTelemetry stack in splunk-opentelemetry 2.13.2.
override-dependencies = [
    "protobuf>=6.33.5",
    # splunk-opentelemetry 2.13.3 still pins the 1.45.1 / 0.66b1 stack.
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-semantic-conventions==0.66b2",
    "opentelemetry-configuration==0.66b2",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation==0.66b2",
    "opentelemetry-instrumentation-logging==0.66b2",
    "opentelemetry-instrumentation-system-metrics==0.66b2",
    "opentelemetry-propagator-b3==1.45.2",
]
constraint-dependencies = [
    "urllib3>=2.8.0",
    "pyjwt>=2.15.1",
    "pillow>=13.0.0",
    "certifi>=2026.10.19",
    "opentelemetry-api>=1.45.2",
    "mcp>=1.30.0,<2",
    "splunk-opentelemetry>=2.13.2",
]
