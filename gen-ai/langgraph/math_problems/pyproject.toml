[project]
name = "math_problems"
version = "0.1.0"
description = "Solving math problems using LangGraph"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "langchain",
    "langchain-openai",
    "langgraph",
    "langgraph-checkpoint",
    "langchain-core>=1.2.28",
    "splunk-opentelemetry",
    "splunk-otel-genai-emitters-splunk",
    "splunk-otel-genai-evals-deepeval",
    "splunk-otel-instrumentation-langchain",
    "splunk-otel-util-genai",
    "splunk-otel-util-genai-evals",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
constraint-dependencies = [
    "urllib3>=2.8.0",
    "langgraph>=1.2.14",
    "langgraph-sdk>=0.4.6",
    "multidict>=6.9.1",
    "certifi>=2026.10.19",
    "aiohttp>=3.14.4",
    "setuptools>=84.1.0",
    # splunk-otel-util-genai imports opentelemetry._events, removed in API 1.45.
    # Stay on the 1.38 distro until that package supports 1.45.1.
    "splunk-opentelemetry==2.8.0",
]
