name: go-linux

on:
  push:
    branches:
      - main
    paths:
      - "instrumentation/go/linux/**"
      - ".github/workflows/go-linux.yml"
  pull_request:
    paths:
      - "instrumentation/go/linux/**"
      - ".github/workflows/go-linux.yml"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instrumentation/go/linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: instrumentation/go/linux/go.mod
          cache-dependency-path: instrumentation/go/linux/go.sum

      - name: Download modules
        run: go mod download

      - name: Build application
        run: go build -v .

      - name: Run go vet
        run: go vet ./...
