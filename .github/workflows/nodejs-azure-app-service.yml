name: nodejs-azure-app-service

on:
  push:
    branches:
      - main
    paths:
      - "instrumentation/nodejs/azure-app-service/**"
      - ".github/workflows/nodejs-azure-app-service.yml"
  pull_request:
    paths:
      - "instrumentation/nodejs/azure-app-service/**"
      - ".github/workflows/nodejs-azure-app-service.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instrumentation/nodejs/azure-app-service/sample-nodejs-azure-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: instrumentation/nodejs/azure-app-service/sample-nodejs-azure-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit
