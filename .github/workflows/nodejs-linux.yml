name: nodejs-linux

on:
  push:
    branches:
      - main
    paths:
      - "instrumentation/nodejs/linux/**"
      - ".github/workflows/nodejs-linux.yml"
  pull_request:
    paths:
      - "instrumentation/nodejs/linux/**"
      - ".github/workflows/nodejs-linux.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instrumentation/nodejs/linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: instrumentation/nodejs/linux/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit
